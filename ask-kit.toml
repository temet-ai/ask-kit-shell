id = "temet.shell"
name = "shell"
version = "0.1.0"
min_ask_kit = "0.3.0"
platforms = ["linux", "macos"]
says = "this user's shell: the command typed for something before (the one that restored a database, converted a video, deployed), what was run in a period or a folder, which commands failed, which programs and commands are used most (shell history: zsh, bash, fish, atuin); where an alias, function or environment variable is set in the startup files and which definition wins; why the wrong program runs first on PATH (which copy wins and which line put its folder there)"
keywords = ["shell history", "(zsh|bash|fish|atuin) history", "\\.zsh_history", "\\.bash_history", "atuin", "what (was|is) the command (i|we) (used|ran|typed)", "command i (ran|used|typed)", "i (ran|typed)", "(did|do) i run", "aliases?", "alias for", "\\.zshrc", "\\.zshenv", "\\.zprofile", "\\.bashrc", "\\.bash_profile", "startup files?", "shell functions?", "env(ironment)? vars?(iables?)?", "wrong (version|copy) of", "wrong (python|node)", "\\bPATH\\b", "which (one|python|node|binary) (runs|wins|is first)", "first on (the )?path", "shadow(s|ed|ing)?"]
route_hint = "what the user typed in a terminal (shell history), where an alias, function or environment variable is defined in .zshrc and the other startup files, and why one program runs instead of another because of PATH order are shell; what a config file in ~/.config sets (keybindings, themes, a terminal's or an app's own settings) is dotfiles; what a coding-agent session ran, in any session, is sessions or mike; what is running now or holds a port is procs; the packages a project depends on, and which version of a library is installed in it, are deps; a git alias's effect on a repository is git"
cite = "the history file or database, the time and folder of the command; for a definition the file and line (~/.zshrc:12); for PATH the entry number and the line that added the folder"
instructions = "instructions.md"
scripts = "scripts"
bench = "bench/questions.json"

[[settings]]
key = "WORKDIR"
about = "the folder questions are about; by default the folder the agent runs in (used when a question says 'here' for a folder)"
detect = ["node", "-e", "process.stdout.write(process.cwd())"]

[[settings]]
key = "SHELL_HOME"
about = "a home folder to read instead of the user's own; leave empty to read the user's own history and startup files"
default = ""

[[sources]]
kind = "module"
name = "shell"
module = "shell.mjs"
api = "api.d.ts"

[[actions]]
name = "which"
title = "Which copy of a program runs first on PATH"
script = "which"
match = ['why (?:does|is) (?:the )?(?<program>[A-Za-z][\w.+-]*) (?:run|runs|running|used|picked|first)(?: from)? (?:the )?wrong', 'which (?<program>[A-Za-z][\w.+-]*) (?:runs|is first|wins|comes first)(?: on (?:my )?path)?', 'what runs when i (?:type|run) (?<program>[A-Za-z][\w.+-]*)']
expect = '"verdict"'
